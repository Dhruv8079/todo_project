{% extends "base.html" %}
{% block title %}Delete Task{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <h2 class="mb-4">Delete Task</h2>
        <p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'task-list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
