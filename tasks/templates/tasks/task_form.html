{% extends "base.html" %}
{% block title %}
    {% if task.pk %}
        Edit Task: {{ task.title }}
    {% else %}
        Add New Task
    {% endif %}
{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <h2 class="mb-4">
            {% if task.pk %}
                Edit Task: {{ task.title }}
            {% else %}
                Add New Task
            {% endif %}
        </h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ task.description }}</textarea>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="work" {% if task.category == 'work' %}selected{% endif %}>Work</option>
                    <option value="personal" {% if task.category == 'personal' %}selected{% endif %}>Personal</option>
                    <option value="study" {% if task.category == 'study' %}selected{% endif %}>Study</option>
                    <option value="other" {% if task.category == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority" required>
                    <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="due_date" class="form-label">Due Date</label>
                <input type="datetime-local" class="form-control" id="due_date" name="due_date" value="{{ task.due_date|date:'Y-m-dTH:i' }}" />
            </div>
            <button type="submit" class="btn btn-success">Save</button>
            <a href="{% url 'task-list' %}" class="btn btn-secondary mt-3">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
